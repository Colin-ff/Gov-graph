# Full GovGraph stack — database, backend API, and frontend SPA.
# Usage: `docker compose up --build`   (reads variables from your .env file)
#   Frontend : http://localhost:5173
#   Backend  : http://localhost:5000  (Swagger UI at /api/docs)
#   Database : localhost:5432
services:
  db:
    image: postgres:16-alpine
    container_name: govgraph-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-govgraph}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-govgraph}
      POSTGRES_DB: ${POSTGRES_DB:-govgraph}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-govgraph} -d ${POSTGRES_DB:-govgraph}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: govgraph-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Reach Postgres by its service name, not localhost, inside the network.
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-govgraph}:${POSTGRES_PASSWORD:-govgraph}@db:5432/${POSTGRES_DB:-govgraph}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-govgraph}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-govgraph}
      POSTGRES_DB: ${POSTGRES_DB:-govgraph}
      SECRET_KEY: ${SECRET_KEY:-dev-secret-change-me}
      # Origin the browser loads the SPA from; must match the frontend port.
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      FLASK_ENV: ${FLASK_ENV:-development}
      # ToR autofill (POST /api/tor/autofill) calls Gemini
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-}
    ports:
      - "5000:5000"
    volumes:
      # Bind-mount source for hot reload; the image already contains the deps.
      - ./backend:/app
    healthcheck:
      # urlopen raises (non-zero exit) unless /health returns 200.
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:5000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    build: ./frontend
    container_name: govgraph-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:5173"
    volumes:
      # Bind-mount source for hot reload, but keep the image's node_modules
      # (Linux binaries) rather than shadowing them with the host's.
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules

volumes:
  pgdata:
  frontend_node_modules:
